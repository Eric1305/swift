[project]
name = "swift"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "openai>=1,<4",
  "pydantic>=2",
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10",
  "pandas>=2",
]

[project.optional-dependencies]
geo = ["osmnx>=2", "networkx>=3.2", "py3dep>=0.17", "geopandas>=0.14", "shapely>=2"]
gpu = ["cupy-cuda12x", "nx-cugraph-cu12"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
