services:
  - type: web
    name: swift-relay
    runtime: python
    plan: free
    buildCommand: pip install -r relay/requirements.txt
    startCommand: uvicorn relay.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: RELAY_SECRET
        sync: false
