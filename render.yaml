services:
  - type: web
    name: swift-relay
    runtime: python
    plan: free
    buildCommand: pip install -r relay/requirements.txt
    startCommand: uvicorn relay.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Only redeploy when the relay itself changes: a redeploy drops any call in progress.
    buildFilter:
      paths:
        - relay/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: RELAY_SECRET
        sync: false
